spring.application.name=covil-calango-api
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# SQL no log só quando pedido (JPA_SHOW_SQL=true): em produção encheria o log a cada requisição.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Envia a mensagem das ResponseStatusException no corpo do erro (o web exibe error.message).
server.error.include-message=always

# Atras do Nginx (HTTPS): respeita X-Forwarded-Proto/Host/For ao montar URLs e redirects.
server.forward-headers-strategy=framework

# Upload de arquivos (imagens de produtos). Em producao o diretorio deve ser um volume persistente.
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Deixa o MaxUploadSizeExceededException chegar ao GlobalExceptionHandler em vez de derrubar a conexao.
server.tomcat.max-swallow-size=-1

# E-mail (Resend via SMTP). A API key do Resend vem da variavel de ambiente RESEND_API_KEY.
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=noreply@covildocalango.tech
# URL publica do web, usada para montar o link de confirmacao enviado por e-mail.
app.web.url=${WEB_URL:http://localhost:4200}
# Autenticacao (JWT em cookie HttpOnly). Em producao defina JWT_SECRET (min. 32 caracteres);
# sem ele um segredo aleatorio e gerado a cada inicio e as sessoes caem ao reiniciar.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:4}
# Secure=true exige HTTPS. SameSite=Lax quando web e API estao no mesmo site; None quando estao em dominios diferentes (exige Secure).
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
# Origens (separadas por virgula) autorizadas a enviar o cookie de sessao.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${WEB_URL:http://localhost:4200}}
# Integracao com o wpp-bot (notificacao dos pedidos pelo WhatsApp). Sem URL ou token o envio e ignorado.
app.wpp-bot.url=${WPP_BOT_URL:}
app.wpp-bot.token=${WPP_BOT_API_TOKEN:}
# URL publica desta API (ex.: https://api.covildocalango.tech). Monta a URL do webhook do Mercado Pago;
# vazia (ambiente local) o PIX e confirmado apenas pela reconciliacao periodica.
app.api.url=${API_URL:}
# Fuso do estabelecimento: define o "dia" dos relatórios (as datas são gravadas no fuso da JVM).
app.fuso-horario=${APP_FUSO_HORARIO:America/Sao_Paulo}
# Pagamento PIX pelo Mercado Pago: credenciais da aplicacao do QR Code. Sem MERCADOPAGO_QRCODE_ACCESS_TOKEN o pagamento
# pelo app fica indisponivel.
# Use o Access Token de teste (TEST-...) em desenvolvimento e o de producao (APP_USR-...) no servidor.
app.mercadopago.qrcode.access-token=${MERCADOPAGO_QRCODE_ACCESS_TOKEN:}
# Chave secreta dos Webhooks (Suas integracoes > Webhooks). Com ela, notificacoes sem assinatura valida sao recusadas.
app.mercadopago.qrcode.webhook-secret=${MERCADOPAGO_QRCODE_WEBHOOK_SECRET:}
# Public Key do Mercado Pago (Suas integracoes > Credenciais), usada pelo formulario de cartao do app. Nao e segredo.
# Sem ela, o pagamento com cartao digitado fica indisponivel (PIX e conta do Mercado Pago continuam).
app.mercadopago.cartao.public-key=${MERCADOPAGO_CARTAO_PUBLIC_KEY:}
# Credenciais da aplicacao do Checkout Transparente (cartao digitado): o Access Token par da MERCADOPAGO_CARTAO_PUBLIC_KEY.
# Sem ele, o cartao usa MERCADOPAGO_QRCODE_ACCESS_TOKEN (o Mercado Pago responde "Invalid credentials" se nao forem da mesma
# aplicacao). A chave secreta dos Webhooks dessa aplicacao tambem e aceita na assinatura.
app.mercadopago.cartao.access-token=${MERCADOPAGO_CARTAO_ACCESS_TOKEN:}
app.mercadopago.cartao.webhook-secret=${MERCADOPAGO_CARTAO_WEBHOOK_SECRET:}
# E-mail tecnico do cliente criado no Mercado Pago para os cartoes salvos no celular ({id} = id do aparelho). Com as
# credenciais de teste, o Mercado Pago so aceita test_payer_{id}@testuser.com.
app.mercadopago.cartao.email-cliente=${MERCADOPAGO_CARTAO_EMAIL_CLIENTE:cliente-{id}@covildocalango.tech}
# Credenciais da aplicacao do Checkout Pro (pagamento na conta do Mercado Pago). Sem o token, a preferencia usa
# MERCADOPAGO_QRCODE_ACCESS_TOKEN. A chave secreta dos Webhooks dessa aplicacao tambem e aceita na assinatura.
app.mercadopago.checkout-pro.access-token=${MERCADOPAGO_PRO_ACCESS_TOKEN:}
app.mercadopago.checkout-pro.webhook-secret=${MERCADOPAGO_PRO_WEBHOOK_SECRET:}
# Nome da loja na fatura do cartao do cliente (ate 22 caracteres); diminui as contestacoes.
app.mercadopago.statement-descriptor=${MERCADOPAGO_STATEMENT_DESCRIPTOR:COVILDOCALANGO}
app.pagamento.pix.expiracao-minutos=${PIX_EXPIRACAO_MINUTOS:30}
# O Mercado Pago exige um e-mail do pagador; o visitante do app nao informa e-mail.
app.pagamento.email-pagador=${MERCADOPAGO_EMAIL_PAGADOR:${app.mail.from}}
app.pagamento.reconciliacao-intervalo-ms=${PAGAMENTO_RECONCILIACAO_INTERVALO_MS:60000}
# Client ID do login Google do web (o mesmo de googleClientId no environment do web).
app.google.client-id=${GOOGLE_CLIENT_ID:746459776771-s9b6rmkspleb3vku95h5o9cndht45ebo.apps.googleusercontent.com}
