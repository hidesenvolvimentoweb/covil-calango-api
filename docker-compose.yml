services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATASOURCE_USER: ${POSTGRES_USER}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY:?Defina RESEND_API_KEY no .env}
      WEB_URL: ${WEB_URL:-http://localhost:4200}
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (minimo 32 caracteres)}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${WEB_URL:-http://localhost:4200}}
      # wpp-bot (notificação dos pedidos pelo WhatsApp): mesmo token definido no .env do bot.
      WPP_BOT_URL: ${WPP_BOT_URL:-http://wp-bot:3000}
      WPP_BOT_API_TOKEN: ${WPP_BOT_API_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-746459776771-s9b6rmkspleb3vku95h5o9cndht45ebo.apps.googleusercontent.com}
      # Pagamento PIX (Mercado Pago). API_URL monta a URL do webhook: ${API_URL}/api/pagamento/webhook/mercadopago
      API_URL: ${API_URL:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_PRO_ACCESS_TOKEN: ${MERCADOPAGO_PRO_ACCESS_TOKEN:-}
      MERCADOPAGO_PRO_WEBHOOK_SECRET: ${MERCADOPAGO_PRO_WEBHOOK_SECRET:-}
      PIX_EXPIRACAO_MINUTOS: ${PIX_EXPIRACAO_MINUTOS:-30}
    ports:
      - "127.0.0.1:${API_PORT}:8080"
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
