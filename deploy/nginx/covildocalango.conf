# Nginx (host da VPS) - proxy reverso para os containers do Covil do Calango.
#
# Instalação:
#   sudo cp deploy/nginx/covildocalango.conf /etc/nginx/sites-available/covildocalango
#   sudo ln -s /etc/nginx/sites-available/covildocalango /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d covildocalango.tech -d www.covildocalango.tech -d api.covildocalango.tech
#
# O certbot adiciona os blocos 443/SSL e o redirect HTTP -> HTTPS automaticamente.
# Portas: WEB_PORT=8080 (covil-calango-web/.env) e API_PORT=8081 (covil-calango-api/.env).

# Web (Angular servido pelo nginx do container)
server {
    listen 80;
    listen [::]:80;
    server_name covildocalango.tech www.covildocalango.tech;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API (Spring Boot)
server {
    listen 80;
    listen [::]:80;
    server_name api.covildocalango.tech;

    # Upload de imagens: a API aceita requisições multipart de até 6MB.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
