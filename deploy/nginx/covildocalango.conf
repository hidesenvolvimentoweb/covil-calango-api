# Nginx (host da VPS) - proxy reverso para os containers do Covil do Calango.
#
# Instalação:
#   sudo cp deploy/nginx/covildocalango.conf /etc/nginx/sites-available/covildocalango
#   sudo ln -s /etc/nginx/sites-available/covildocalango /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d covildocalango.tech -d www.covildocalango.tech -d api.covildocalango.tech
#
# O certbot adiciona os blocos 443/SSL e o redirect HTTP -> HTTPS automaticamente.
# Portas: WEB_PORT=8080 (covil-calango-web/.env) e API_PORT=8081 (covil-calango-api/.env).

# Web (Angular servido pelo nginx do container)
server {
    listen 80;
    listen [::]:80;
    server_name covildocalango.tech www.covildocalango.tech;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API (Spring Boot)
server {
    listen 80;
    listen [::]:80;
    server_name api.covildocalango.tech;

    # X-Forwarded-For com o IP real da conexão ($remote_addr), e não $proxy_add_x_forwarded_for: este repassa o
    # valor enviado pelo cliente, que poderia inventar um IP e escapar dos limites de tentativas da API (login,
    # recuperação de senha, solicitações). Atrás do Cloudflare, use o módulo real_ip com CF-Connecting-IP.

    # Upload de imagens: a API aceita requisições multipart de até 6MB.
    client_max_body_size 10M;

    # WebSocket/SockJS (WebSocketConfig: /covil-ws). Sem os cabeçalhos Upgrade/Connection o Spring recusa o
    # WebSocket ("Handshake failed due to invalid Upgrade header: null") e o SockJS cai para xhr_streaming/eventsource;
    # com o buffer do nginx ligado, esses fallbacks também travam ("No messages received after 60000 ms").
    location /covil-ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Mensagens em tempo real: entrega imediata e conexão aberta por até 1 hora sem tráfego.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
