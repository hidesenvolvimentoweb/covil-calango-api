services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-covil_calango}
      POSTGRES_USER: ${POSTGRES_USER:-covil_calango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-covil_calango}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-covil_calango}
      DATASOURCE_USER: ${POSTGRES_USER:-covil_calango}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-covil_calango}
    ports:
      - "${API_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
